    # kd: [1.5, 2, 1.0, 1.5, 2, 1.0]
    kp: [20.0, 20.0, 30.0, 0.0, 20.0, 20.0, 30.0, 0.0]
    kd: [2.0, 2.0, 3, 1.0, 2.0, 2.0, 3, 1.0]
